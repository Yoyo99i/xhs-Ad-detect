<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小红书种草翻车检测</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --red: #ff2e4d;
      --red-soft: #fff0f2;
      --ink: #1f1f1f;
      --gray: #8a8a8a;
      --line: #ececec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #fafafa;
      color: var(--ink);
      line-height: 1.7;
    }
    header {
      background: var(--red);
      color: #fff;
      padding: 18px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 6px 0 0; font-size: 13px; opacity: .9; }
    main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
    label { display: block; font-weight: 600; margin: 16px 0 8px; font-size: 15px; }
    textarea {
      width: 100%;
      min-height: 160px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 14px;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: var(--red); }
    .meta { font-size: 12px; color: var(--gray); margin-top: 6px; }
    button#btn {
      margin-top: 14px;
      width: 100%;
      padding: 13px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button#btn:disabled { background: #ffb3bf; cursor: not-allowed; }
    #status {
      margin-top: 14px;
      font-size: 14px;
      color: var(--red);
      min-height: 20px;
    }
    #result { margin-top: 22px; display: none; }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .card h2 { margin: 0 0 10px; font-size: 16px; color: var(--red); }
    #summary { background: var(--red-soft); border-color: #ffd6dd; }
    .result-head { font-size: 17px; font-weight: 700; margin: 4px 0 2px; }
    .card-label { font-size: 12px; color: var(--gray); margin-bottom: 6px; }
    details {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px 18px;
    }
    details summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 0;
      list-style: none;
    }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: "▸ "; color: var(--red); }
    details[open] summary::before { content: "▾ "; }
    .markdown h3 { font-size: 15px; margin: 14px 0 6px; }
    .markdown ul, .markdown ol { padding-left: 22px; margin: 6px 0; }
    .markdown code {
      background: #f3f3f3; padding: 1px 5px; border-radius: 4px; font-size: 13px;
    }
    .markdown blockquote {
      border-left: 3px solid var(--red); margin: 10px 0; padding: 4px 12px; color: #555; background: #fff;
    }
    /* S2.1 维度条：把命中维度渲染成「进度条 + 严重程度徽章 + 证据高亮」 */
    .verdict-note {
      font-size: 12px;
      color: var(--gray);
      background: #f7f7f7;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }
    .dim-list { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
    .dim-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .dim-name { font-weight: 600; font-size: 14px; }
    .badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; color: #fff; white-space: nowrap; }
    .lv-low { background: #f0a020; }
    .lv-mid { background: #ff7a00; }
    .lv-high { background: var(--red); }
    .bar { height: 8px; background: #f0f0f0; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
    .bar-fill.lv-low { background: #f0a020; }
    .bar-fill.lv-mid { background: #ff7a00; }
    .bar-fill.lv-high { background: var(--red); }
    .dim-evi { font-size: 13px; color: #555; margin-top: 7px; }
    .dim-evi mark, .dim-note mark { background: #fff3a3; padding: 0 3px; border-radius: 3px; color: inherit; }
    .dim-note { font-size: 13px; color: #555; margin: 4px 0; }
    #disclaimer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--gray);
      text-align: center;
      border-top: 1px dashed var(--line);
      padding-top: 14px;
    }
    .err { color: var(--red); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>小红书种草翻车检测</h1>
    <p>粘贴笔记正文，AI 帮你识别疑似软广 / 违规风险</p>
  </header>

  <main>
    <label for="note">粘贴小红书笔记正文</label>
    <textarea id="note" placeholder="把小红书笔记的正文粘贴到这里（最多 5000 字）…"></textarea>
    <div class="meta">最多 5000 字 · 仅作本地分析，不上传任何第三方</div>

    <button id="btn">开始检测</button>
    <div id="status"></div>

    <div id="result">
      <div class="result-head">📋 检测报告</div>
      <div class="card-label">下方红框即「风险结论 / 一句话判断」；再往下可展开看命中维度明细</div>
      <div class="verdict-note">以下为 AI 对「疑似营销话术」的识别结论，可信度待你自行判断，仅供参考。</div>
      <div id="summary" class="card markdown"></div>
      <details id="details">
        <summary>查看评分依据（命中维度明细）</summary>
        <div id="detail-body" class="markdown"></div>
      </details>
    </div>

    <div id="disclaimer">
      本结果由 AI 生成，仅供参考，不构成官方认定，请以平台与监管判定为准。
    </div>
  </main>

  <script>
    const btn = document.getElementById("btn");
    const note = document.getElementById("note");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const summaryEl = document.getElementById("summary");
    const detailBody = document.getElementById("detail-body");
    const details = document.getElementById("details");

    function setStatus(msg, isErr) {
      statusEl.textContent = msg || "";
      statusEl.className = isErr ? "err" : "";
    }

    // 把 agent 返回的 Markdown 渲染出来。
    // 优先按 "## 评分依据" 切成「风险结论(首屏)」+「命中维度明细(折叠)」；
    // 若 AI 没按该结构输出，则整段放进结论区，避免折叠区空白、结论“消失”。
    function cleanReport(md) {
      md = (md || "").trim();
      // AI 常把 prompt/知识库/笔记原文复述一遍，找真正的报告起点（取最后一个，避免假标记）
      const beginMarker = "---BEGIN---";
      let idx = md.lastIndexOf(beginMarker);
      if (idx >= 0) return md.slice(idx + beginMarker.length).trim();
      // 兼容 AI 没输出 ---BEGIN--- 的情况：取最后一个 "## 摘要"
      idx = md.lastIndexOf("## 摘要");
      if (idx >= 0) return md.slice(idx).trim();
      return md;
    }

    // S2.1：把评分依据解析成「维度条 + 严重程度徽章 + 证据高亮」
    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    // 严重程度 → 进度条宽度(轻40/中70/重100) + 样式类 + 中文标签
    const LEVEL_MAP = {
      "轻": { pct: 40, cls: "lv-low", label: "轻度" },
      "中": { pct: 70, cls: "lv-mid", label: "中度" },
      "重": { pct: 100, cls: "lv-high", label: "重度" }
    };

    function dimBar(name, level, evidence) {
      const info = LEVEL_MAP[level] || LEVEL_MAP["中"];
      return (
        '<div class="dim">' +
          '<div class="dim-top">' +
            '<span class="dim-name">' + escapeHtml(name) + '</span>' +
            '<span class="badge ' + info.cls + '">' + info.label + '</span>' +
          '</div>' +
          '<div class="bar"><div class="bar-fill ' + info.cls + '" style="width:' + info.pct + '%"></div></div>' +
          '<div class="dim-evi">证据原文：<mark>' + escapeHtml(evidence) + '</mark></div>' +
        '</div>'
      );
    }

    // 逐行解析评分依据；命中维度 → 维度条，普通说明行 → 降级为文字（引号内证据高亮）
    function renderDimensions(detailMd) {
      const lines = (detailMd || "").split(/\n+/).map(l => l.trim()).filter(Boolean);
      if (!lines.length) return "";
      let html = '<div class="dim-list">';
      let found = 0;
      for (const line of lines) {
        // 匹配：维度名（程度：轻/中/重）："证据句"
        const m = line.match(/^(.*?)[\（(]程度[:：]\s*(轻|中|重)[\）)]\s*[:：]?\s*["“”](.+?)["“”]/);
        if (m) {
          found++;
          const name = (m[1].replace(/^[-*•\d+．.、\s]+/, "").trim()) || "未命名维度";
          html += dimBar(name, m[2], m[3]);
        } else {
          const safe = escapeHtml(line).replace(/["“”](.+?)["“”]/g, '<mark>$1</mark>');
          html += '<p class="dim-note">' + safe + '</p>';
        }
      }
      html += '</div>';
      return found > 0 ? html : "";
    }

    function renderReport(md) {
      md = cleanReport(md);
      if (!md) {
        summaryEl.innerHTML = '<p class="err">未获取到分析内容，请重试或更换笔记后再次检测。</p>';
        detailBody.innerHTML = "";
        details.open = false;
        resultEl.style.display = "block";
        resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      // 找两个锚点：## 评分依据 和 ## 给普通用户的提醒
      const reScore = /(^|\n)\s*#{0,2}\s*评分依据\s*\n/;
      const reTip = /(^|\n)\s*#{0,2}\s*给普通用户的提醒\s*\n/;
      let idxScore = -1, idxTip = -1;
      let m, searchFrom = 0;
      while ((m = md.slice(searchFrom).match(reScore)) !== null) {
        idxScore = searchFrom + m.index + m[1].length;
        searchFrom = idxScore + 1;
      }
      searchFrom = 0;
      while ((m = md.slice(searchFrom).match(reTip)) !== null) {
        idxTip = searchFrom + m.index + m[1].length;
        searchFrom = idxTip + 1;
      }

      let summaryMd, detailMd;
      if (idxScore >= 0 && idxTip > idxScore) {
        // 首屏 = 摘要 + 给使用者的提醒；折叠区 = 评分依据
        summaryMd = md.slice(0, idxScore).trim() + "\n\n" + md.slice(idxTip).trim();
        detailMd = md.slice(idxScore, idxTip).trim();
      } else if (idxScore >= 0) {
        summaryMd = md.slice(0, idxScore).trim();
        detailMd = md.slice(idxScore).trim();
      } else {
        summaryMd = md;
        detailMd = "_（本次 AI 未按要求分节，完整报告已显示在上方「风险结论」中）_";
      }

      // 去掉折叠区里重复的 "## 评分依据" 标题
      detailMd = detailMd.replace(/^\s*#*\s*评分依据\s*\n*/i, "");

      summaryEl.innerHTML = marked.parse(summaryMd);
      // S2.1：优先把评分依据渲染成维度条；解析不到维度时降级为 Markdown
      const dimHtml = renderDimensions(detailMd);
      detailBody.innerHTML = dimHtml || marked.parse(detailMd);
      details.open = false;
      resultEl.style.display = "block";
      resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    let pollTimer = null;
    let pollStartAt = 0;
    async function pollStatus(taskId) {
      try {
        const resp = await fetch("/api/status?taskId=" + encodeURIComponent(taskId));
        const data = await resp.json();
        if (data.status === "done") {
          renderReport(data.result);
          const sec = Math.round((Date.now() - pollStartAt) / 1000);
          setStatus("分析完成，共耗时约 " + sec + " 秒");
          btn.disabled = false;
          return;
        }
        if (data.status === "error") {
          setStatus("分析失败：" + (data.error || "未知错误"), true);
          btn.disabled = false;
          return;
        }
        // running：每秒更新一次等待时间
        const sec = Math.round((Date.now() - pollStartAt) / 1000);
        setStatus("分析中，已等待 " + sec + " 秒…");
        pollTimer = setTimeout(() => pollStatus(taskId), 1000);
      } catch (e) {
        setStatus("轮询出错：" + e.message + "（仍在重试）", true);
        pollTimer = setTimeout(() => pollStatus(taskId), 1000);
      }
    }

    btn.addEventListener("click", async () => {
      const text = note.value.trim();
      if (!text) { setStatus("请先粘贴笔记正文", true); return; }
      if (text.length > 5000) { setStatus("超出 5000 字上限，请删减后再试", true); return; }

      btn.disabled = true;
      resultEl.style.display = "none";
      if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
      setStatus("已提交，正在启动分析…");

      try {
        const resp = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ note_text: text })
        });
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          const msg = (data && data.error) ? data.error : ("请求失败（HTTP " + resp.status + "）");
          setStatus("出错了：" + msg + (data && data.code ? " [" + data.code + "]" : ""), true);
          btn.disabled = false;
          return;
        }
        // 拿到任务号，开始轮询
        pollStartAt = Date.now();
        pollStatus(data.taskId);
      } catch (e) {
        setStatus("网络或服务器错误：" + e.message, true);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
